<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zarate Security | Acceso</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #08294d, #050505 60%);
            color: white;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            background: rgba(10, 10, 10, 0.96);
            border: 1px solid #087cff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(8, 124, 255, 0.20);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #087cff, #050505);
            border: 2px solid #087cff;
            font-size: 34px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 25px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: 1px solid #333;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #087cff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #087cff, #0055a8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #mensaje {
            min-height: 22px;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            ZS
        </div>

        <h1>
            ZARATE SECURITY
        </h1>

        <p class="subtitle">
            Panel Administrativo
        </p>

        <form id="loginForm">

            <div class="campo">

                <label for="usuario">
                    Usuario
                </label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingrese su usuario"
                    required
                >

            </div>

            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingrese su contraseña"
                    required
                >

            </div>

            <button type="submit">
                INGRESAR
            </button>

        </form>

        <div id="mensaje"></div>

        <div class="footer">
            © 2026 Zarate Security
        </div>

    </div>


    <script>

        const formulario = document.getElementById("loginForm");

        const mensaje = document.getElementById("mensaje");


        formulario.addEventListener("submit", async function(event) {

            event.preventDefault();


            const usuario =
                document.getElementById("usuario").value.trim();

            const password =
                document.getElementById("password").value;


            mensaje.style.color = "#aaa";

            mensaje.textContent =
                "Verificando acceso...";


            try {

                const respuesta = await fetch(
                    "http://localhost:3000/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({
                            usuario: usuario,
                            password: password
                        })
                    }
                );


                const datos = await respuesta.json();


                if (datos.ok) {

                    mensaje.style.color = "#00ff88";

                    mensaje.textContent =
                        "Acceso correcto. Entrando...";


                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 800);


                } else {

                    mensaje.style.color = "#ff4444";

                    mensaje.textContent =
                        datos.mensaje ||
                        "Usuario o contraseña incorrectos.";

                }


            } catch (error) {

                console.error(
                    "Error de conexión:",
                    error
                );

                mensaje.style.color = "#ff4444";

                mensaje.textContent =
                    "No se pudo conectar con el servidor.";

            }

        });

    </script>

</body>

</html>
